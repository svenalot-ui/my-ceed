<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Мой Сид</title>
<meta name="description" content="Расходы, заправки и поломки вашей машины">
<meta name="theme-color" content="#F4F3EF">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мой Сид">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>
  // apply theme before first paint to avoid a flash
  try { var t = JSON.parse(localStorage.getItem('myceed-theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <div id="view" aria-live="polite"></div>
  <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
</div>
<div id="layers"></div>
<div id="toast" role="status"></div>
<noscript><p style="padding:24px">Для работы нужен JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
